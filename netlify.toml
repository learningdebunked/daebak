# Daebak — Netlify configuration

[build]
  publish = "."

# HTML: always revalidate so content updates are instant
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Assets (PDF etc): cache for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA-style fallback: any unmatched path → homepage
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
