<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Interactive ratios practice problems - understand WHY, not just WHAT">
<title>Ratios Practice — 대박 Daebak</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#ff6b9d;--pink-l:#ffe4ef;--purple:#7c3aed;--purp-l:#a78bfa;
  --purp-bg:#f5f3ff;--hero:#0d0618;
  --surface:#fff;--text:#1a0a2e;--muted:#64748b;--border:#e8e4f4;
  --green:#10b981;--green-l:#d1fae5;
  --red:#ef4444;--red-l:#fee2e2;
  --orange:#f59e0b;--orange-l:#fef3c7;
  --r:14px;
}
html{scroll-behavior:smooth;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--purp-bg);color:var(--text);line-height:1.6;min-height:100vh}

/* NAV */
nav{position:sticky;top:0;z-index:100;background:rgba(13,6,24,.96);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,107,157,.18);padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;height:58px}
.nav-logo{font-size:1.25rem;font-weight:900;color:#fff;text-decoration:none;
  display:flex;align-items:center;gap:7px;letter-spacing:-.3px}
.nav-logo .kr{color:var(--pink)}
.nav-back{color:rgba(255,255,255,.7);text-decoration:none;font-size:.9rem;
  padding:6px 14px;border-radius:20px;transition:all .15s;display:flex;align-items:center;gap:6px}
.nav-back:hover{color:#fff;background:rgba(255,255,255,.1)}

/* CONTAINER */
.container{max-width:880px;margin:0 auto;padding:40px 24px}

/* HEADER */
.header{text-align:center;margin-bottom:40px}
.header h1{font-size:clamp(1.8rem,4vw,2.5rem);font-weight:900;
  letter-spacing:-.8px;margin-bottom:12px}
.header h1 .emoji{font-size:1.2em}
.header p{color:var(--muted);font-size:1rem;margin-bottom:20px}
.progress-bar{background:#e5e7eb;height:10px;border-radius:99px;overflow:hidden;max-width:400px;margin:0 auto}
.progress-fill{background:linear-gradient(90deg,var(--orange),var(--pink));
  height:100%;width:0%;transition:width .4s ease;border-radius:99px}
.score{margin-top:12px;font-size:.9rem;font-weight:700;color:var(--orange)}

/* PROBLEM CARD */
.problem{background:#fff;border-radius:var(--r);padding:32px 28px;
  border:1.5px solid var(--border);box-shadow:0 4px 20px rgba(245,158,11,.1);
  margin-bottom:24px;display:none}
.problem.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.prob-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.prob-num{font-size:.8rem;font-weight:800;text-transform:uppercase;
  letter-spacing:1px;color:var(--orange)}
.diff{padding:4px 12px;border-radius:99px;font-size:.75rem;font-weight:700}
.diff.easy{background:#d1fae5;color:#065f46}
.diff.medium{background:#fef3c7;color:#92400e}
.diff.hard{background:#fee2e2;color:#991b1b}
.prob-title{font-size:1.3rem;font-weight:800;margin-bottom:16px;color:var(--text)}
.prob-q{font-size:1.05rem;margin-bottom:16px;line-height:1.7}
.context-box{background:var(--orange-l);border-left:4px solid var(--orange);
  padding:16px 20px;border-radius:0 12px 12px 0;margin:16px 0;font-size:.95rem;line-height:1.6}
.answer-box{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:24px}
.answer-box input{flex:1;min-width:200px;padding:14px 18px;border:2px solid var(--border);
  border-radius:12px;font-size:1.05rem;font-weight:600;transition:all .2s}
.answer-box input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(245,158,11,.1)}
.btn{padding:14px 28px;border-radius:99px;font-size:.95rem;font-weight:700;
  cursor:pointer;border:none;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.btn-check{background:var(--orange);color:#fff}
.btn-check:hover{background:#d97706;transform:translateY(-2px)}
.btn-check:disabled{background:#cbd5e1;cursor:not-allowed;transform:none}
.btn-next{background:var(--pink);color:#fff}
.btn-next:hover{background:#ff5a8a;transform:translateY(-2px)}
.btn-hint{background:var(--purp-bg);color:var(--purple);border:2px solid var(--purple);
  padding:10px 20px;font-size:.85rem}
.btn-hint:hover{background:var(--purple);color:#fff}

/* FEEDBACK */
.feedback{margin-top:20px;padding:16px 20px;border-radius:12px;display:none;animation:slideDown .3s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.feedback.show{display:block}
.feedback.correct{background:var(--green-l);border:2px solid var(--green);color:#065f46}
.feedback.wrong{background:var(--red-l);border:2px solid var(--red);color:#991b1b}
.feedback-title{font-weight:800;font-size:1.05rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.feedback-text{font-size:.95rem;line-height:1.7}
.feedback-text strong{font-weight:700}

/* HINT BOX */
.hint-box{background:var(--purp-bg);border:2px dashed var(--purple);
  padding:16px 20px;border-radius:12px;margin-top:16px;display:none}
.hint-box.show{display:block;animation:slideDown .3s ease}
.hint-title{font-weight:800;color:var(--purple);margin-bottom:8px;font-size:.95rem}
.hint-text{font-size:.9rem;color:var(--text);line-height:1.6}

/* RESULTS */
.results{background:#fff;border-radius:var(--r);padding:40px 32px;
  border:1.5px solid var(--border);box-shadow:0 4px 20px rgba(245,158,11,.1);
  text-align:center;display:none}
.results.show{display:block;animation:fadeIn .5s ease}
.results-emoji{font-size:80px;margin-bottom:16px}
.results h2{font-size:2rem;font-weight:900;margin-bottom:12px;color:var(--orange)}
.results-score{font-size:3.5rem;font-weight:900;color:var(--pink);margin-bottom:8px}
.results-msg{font-size:1.1rem;color:var(--muted);margin-bottom:32px}
.results-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:16px;margin-bottom:32px}
.stat-box{background:var(--orange-l);padding:16px;border-radius:12px;border:2px solid var(--orange)}
.stat-num{font-size:1.8rem;font-weight:900;color:var(--orange);display:block}
.stat-label{font-size:.8rem;color:#92400e;text-transform:uppercase;letter-spacing:.5px}
.btn-restart{background:var(--pink);color:#fff;text-decoration:none;
  padding:14px 32px;border-radius:99px;font-weight:700;display:inline-block;
  transition:all .2s;margin:0 8px 8px}
.btn-restart:hover{background:#ff5a8a;transform:translateY(-2px)}
.btn-home{background:var(--orange);color:#fff;text-decoration:none;
  padding:14px 32px;border-radius:99px;font-weight:700;display:inline-block;
  transition:all .2s;margin:0 8px 8px}
.btn-home:hover{background:#d97706;transform:translateY(-2px)}

@media(max-width:768px){
  .container{padding:30px 20px}
  .problem{padding:24px 20px}
  .answer-box{flex-direction:column}
  .answer-box input{width:100%}
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <span class="kr">대박</span> Daebak
  </a>
  <a href="ratios-home.html" class="nav-back">← Back to Ratios</a>
</nav>

<div class="container">
  
  <div class="header">
    <h1><span class="emoji">🔢</span> Ratios Practice</h1>
    <p>11 problems from your worksheet - with WHY explanations!</p>
    <div class="progress-bar">
      <div class="progress-fill" id="progressBar"></div>
    </div>
    <div class="score" id="scoreDisplay">Score: 0 / 0</div>
  </div>

  <div id="problemsContainer"></div>

  <div class="results" id="results">
    <div class="results-emoji" id="resultsEmoji">🎉</div>
    <h2>Practice Complete!</h2>
    <div class="results-score" id="finalScore">0%</div>
    <div class="results-msg" id="resultsMsg">Great work!</div>
    <div class="results-stats">
      <div class="stat-box">
        <span class="stat-num" id="correctCount">0</span>
        <span class="stat-label">Correct</span>
      </div>
      <div class="stat-box">
        <span class="stat-num" id="totalCount">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat-box">
        <span class="stat-num" id="accuracyPercent">0%</span>
        <span class="stat-label">Accuracy</span>
      </div>
    </div>
    <div>
      <a href="practice-ratios.html" class="btn-restart">Try Again</a>
      <a href="ratios-home.html" class="btn-home">Back to Ratios</a>
    </div>
  </div>

</div>

<script src="practice-ratios-data.js"></script>
<script>
let currentProblem = 0;
let score = 0;
let answered = [];

function init() {
  renderProblems();
  showProblem(0);
  updateProgress();
}

function renderProblems() {
  const container = document.getElementById('problemsContainer');
  container.innerHTML = ratiosProblems.map((p, idx) => `
    <div class="problem" id="problem-${idx}" data-index="${idx}">
      <div class="prob-header">
        <span class="prob-num">Problem ${idx + 1} of ${ratiosProblems.length}</span>
        <span class="diff ${p.difficulty}">${p.difficulty}</span>
      </div>
      <h3 class="prob-title">${p.title}</h3>
      <div class="prob-q">${p.question}</div>
      ${p.context ? `<div class="context-box">${p.context}</div>` : ''}
      
      <div class="answer-box">
        <input 
          type="text" 
          id="answer-${idx}" 
          placeholder="Your answer..."
          onkeypress="if(event.key==='Enter') checkAnswer(${idx})"
        >
        <button class="btn btn-check" onclick="checkAnswer(${idx})" id="checkBtn-${idx}">
          Check Answer
        </button>
      </div>

      <button class="btn btn-hint" onclick="showHint(${idx})" id="hintBtn-${idx}">
        💡 Need a hint?
      </button>

      <div class="hint-box" id="hint-${idx}">
        <div class="hint-title">💡 Hint:</div>
        <div class="hint-text">${p.hint}</div>
      </div>

      <div class="feedback" id="feedback-${idx}">
        <div class="feedback-title" id="feedbackTitle-${idx}"></div>
        <div class="feedback-text" id="feedbackText-${idx}"></div>
      </div>

      <div style="margin-top:20px;display:none" id="nextBtn-${idx}">
        <button class="btn btn-next" onclick="nextProblem()">
          Next Problem →
        </button>
      </div>
    </div>
  `).join('');
}

function showProblem(index) {
  document.querySelectorAll('.problem').forEach(p => p.classList.remove('active'));
  const problem = document.getElementById(`problem-${index}`);
  if (problem) {
    problem.classList.add('active');
    document.getElementById(`answer-${index}`).focus();
  }
}

function showHint(index) {
  const hint = document.getElementById(`hint-${index}`);
  hint.classList.toggle('show');
}

function checkAnswer(index) {
  const problem = ratiosProblems[index];
  const input = document.getElementById(`answer-${index}`);
  const userAnswer = input.value.trim().toUpperCase();
  const correctAnswer = String(problem.answer).toUpperCase();
  
  const feedback = document.getElementById(`feedback-${index}`);
  const feedbackTitle = document.getElementById(`feedbackTitle-${index}`);
  const feedbackText = document.getElementById(`feedbackText-${index}`);
  const checkBtn = document.getElementById(`checkBtn-${index}`);
  const nextBtn = document.getElementById(`nextBtn-${index}`);
  
  // Disable input and check button
  input.disabled = true;
  checkBtn.disabled = true;
  
  // Check if already answered
  if (answered[index]) return;
  answered[index] = true;
  
  const isCorrect = userAnswer === correctAnswer || 
                    (problem.unit && userAnswer === `${correctAnswer} ${problem.unit}`.toUpperCase());
  
  if (isCorrect) {
    score++;
    feedback.classList.add('correct');
    feedbackTitle.innerHTML = '✅ Correct!';
    feedbackText.innerHTML = problem.explanation;
  } else {
    feedback.classList.add('wrong');
    feedbackTitle.innerHTML = '❌ Not quite right';
    feedbackText.innerHTML = `
      The correct answer is <strong>${problem.answer}${problem.unit ? ' ' + problem.unit : ''}</strong>.<br><br>
      ${problem.explanation}
    `;
  }
  
  feedback.classList.add('show');
  nextBtn.style.display = 'block';
  updateProgress();
}

function nextProblem() {
  currentProblem++;
  if (currentProblem < ratiosProblems.length) {
    showProblem(currentProblem);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    showResults();
  }
}

function updateProgress() {
  const progress = (answered.filter(Boolean).length / ratiosProblems.length) * 100;
  document.getElementById('progressBar').style.width = progress + '%';
  document.getElementById('scoreDisplay').textContent = 
    `Score: ${score} / ${answered.filter(Boolean).length}`;
}

function showResults() {
  document.getElementById('problemsContainer').style.display = 'none';
  const results = document.getElementById('results');
  results.classList.add('show');
  
  const percentage = Math.round((score / ratiosProblems.length) * 100);
  document.getElementById('finalScore').textContent = percentage + '%';
  document.getElementById('correctCount').textContent = score;
  document.getElementById('totalCount').textContent = ratiosProblems.length;
  document.getElementById('accuracyPercent').textContent = percentage + '%';
  
  let emoji, message;
  if (percentage === 100) {
    emoji = '🏆';
    message = 'Perfect score! You truly understand ratios!';
  } else if (percentage >= 80) {
    emoji = '🎉';
    message = 'Excellent work! You have a strong grasp of ratios!';
  } else if (percentage >= 60) {
    emoji = '👍';
    message = 'Good job! Review the explanations to master ratios!';
  } else {
    emoji = '📚';
    message = 'Keep practicing! Review the Learn page and try again!';
  }
  
  document.getElementById('resultsEmoji').textContent = emoji;
  document.getElementById('resultsMsg').textContent = message;
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Initialize on load
window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
